<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ماينورتي بارتنرز — ستة أشهر من البناء الهادئ">

  <!-- Background: ink (mirrors philosophy section aesthetic) -->
  <rect width="1200" height="630" fill="#0E0E10"/>

  <!-- Grid lines — bone-on-dark, same pattern as hero -->
  <line x1="150"  y1="0" x2="150"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>
  <line x1="300"  y1="0" x2="300"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>
  <line x1="450"  y1="0" x2="450"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>
  <line x1="600"  y1="0" x2="600"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>
  <line x1="750"  y1="0" x2="750"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>
  <line x1="900"  y1="0" x2="900"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>
  <line x1="1050" y1="0" x2="1050" y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.05"/>

  <!-- Outer rules -->
  <line x1="0" y1="0"   x2="1200" y2="0"   stroke="#ECE6DA" stroke-width="1" opacity="0.14"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#ECE6DA" stroke-width="1" opacity="0.14"/>

  <!-- Cobalt right accent bar (RTL — mirrored from EN) -->
  <rect x="1134" y="52" width="2" height="76" fill="#151BB5"/>

  <!-- MP monogram — right side -->
  <text x="1120" y="78"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="24" fill="#151BB5" letter-spacing="5" text-anchor="end">MP</text>

  <!-- Brand name — right -->
  <text x="1136" y="108"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#B9B2A5" letter-spacing="3" text-anchor="end">MINORITY PARTNERS</text>

  <!-- Category · date — Arabic, right-aligned -->
  <text x="1136" y="176"
        font-family="'Simplified Arabic', 'Geeza Pro', 'Arial Unicode MS', Arial, sans-serif"
        font-size="13" fill="#B9B2A5" text-anchor="end" direction="rtl">رأي  ·  ١ يوليو ٢٠٢٦  ·  ٣ دقائق</text>

  <!-- Short accent rule — right side -->
  <line x1="944" y1="192" x2="1136" y2="192" stroke="#ECE6DA" stroke-width="1" opacity="0.16"/>

  <!-- Article title in Arabic — large, right-anchored -->
  <text x="1136" y="290"
        font-family="'Simplified Arabic', 'Geeza Pro', 'Arial Unicode MS', Arial, sans-serif"
        font-size="54" fill="#ECE6DA" text-anchor="end" direction="rtl">ستة أشهر من البناء الهادئ</text>

  <!-- Cobalt accent line below title -->
  <line x1="680" y1="322" x2="1136" y2="322" stroke="#151BB5" stroke-width="1" opacity="0.5"/>

  <!-- Description line 1 — Arabic, right-aligned -->
  <text x="1136" y="376"
        font-family="'Simplified Arabic', 'Geeza Pro', 'Arial Unicode MS', Arial, sans-serif"
        font-size="18" fill="#ECE6DA" text-anchor="end" direction="rtl" opacity="0.68">انطلقت ماينورتي بارتنرز من المدينة المنورة في يناير ٢٠٢٦.</text>

  <!-- Description line 2 -->
  <text x="1136" y="406"
        font-family="'Simplified Arabic', 'Geeza Pro', 'Arial Unicode MS', Arial, sans-serif"
        font-size="18" fill="#ECE6DA" text-anchor="end" direction="rtl" opacity="0.68">النصف الأول — تأسيس حقيقي قبل توظيف أي ريال.</text>

  <!-- Footer rule -->
  <line x1="0" y1="548" x2="1200" y2="548" stroke="#ECE6DA" stroke-width="1" opacity="0.08"/>

  <!-- Author — right -->
  <text x="1136" y="586"
        font-family="'Simplified Arabic', 'Geeza Pro', 'Arial Unicode MS', Arial, sans-serif"
        font-size="11" fill="#B9B2A5" text-anchor="end" direction="rtl">عبدالمجيد التركي  ·  الشريك المدير</text>

  <!-- Year — left -->
  <text x="64" y="586"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#6E6961" letter-spacing="2.5">2026</text>

</svg>
