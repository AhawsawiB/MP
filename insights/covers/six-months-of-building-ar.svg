<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ماينورتي بارتنرز — ستة أشهر من البناء الهادئ">

  <!-- Background: identical to EN cover — same brand shade, different from site bone -->
  <rect width="1200" height="630" fill="#E2DAC9"/>

  <!-- Grid — vertical lines (identical to EN) -->
  <line x1="150"  y1="0" x2="150"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="300"  y1="0" x2="300"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="450"  y1="0" x2="450"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="600"  y1="0" x2="600"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="750"  y1="0" x2="750"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="900"  y1="0" x2="900"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="1050" y1="0" x2="1050" y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>

  <!-- Grid — horizontal lines (identical to EN) -->
  <line x1="0" y1="90"  x2="1200" y2="90"  stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#0E0E10" stroke-width="1" opacity="0.06"/>

  <!-- Outer border (identical to EN) -->
  <rect width="1200" height="630" fill="none" stroke="#0E0E10" stroke-width="1" opacity="0.14"/>

  <!-- Decorative circles — upper LEFT (RTL mirror of EN's upper right) -->
  <circle cx="140" cy="195" r="112" stroke="#0E0E10" stroke-width="1" fill="none" opacity="0.07"/>
  <circle cx="140" cy="195" r="55"  stroke="#0E0E10" stroke-width="1" fill="none" opacity="0.11"/>

  <!-- Header rule (identical to EN) -->
  <line x1="64" y1="128" x2="1136" y2="128" stroke="#0E0E10" stroke-width="1" opacity="0.20"/>

  <!-- MP monogram — top RIGHT (RTL mirror of EN's top left) -->
  <text x="1136" y="72"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="22" font-weight="400" fill="#0E0E10" letter-spacing="4" text-anchor="end">MP</text>

  <!-- Brand · location — right aligned -->
  <text x="1136" y="100"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#0E0E10" opacity="0.42" letter-spacing="2.8" text-anchor="end">MINORITY PARTNERS  ·  MADINAH</text>

  <!-- Category · date · read time — Arabic, right aligned -->
  <text x="1136" y="162"
        font-family="'Simplified Arabic', 'Geeza Pro', Arial, sans-serif"
        font-size="13" fill="#0E0E10" opacity="0.48" text-anchor="end" direction="rtl">رأي  ·  ١ يوليو ٢٠٢٦  ·  ٣ دقائق قراءة</text>

  <!-- Title line 1 — ink, right aligned -->
  <text x="1136" y="278"
        font-family="'Simplified Arabic', 'Geeza Pro', Arial, sans-serif"
        font-size="62" font-weight="400" fill="#0E0E10" text-anchor="end" direction="rtl">ستة أشهر من</text>

  <!-- Title line 2 — cobalt (mirrors EN's cobalt italic second line) -->
  <text x="1136" y="356"
        font-family="'Simplified Arabic', 'Geeza Pro', Arial, sans-serif"
        font-size="62" font-weight="400" fill="#151BB5" text-anchor="end" direction="rtl">البناء الهادئ</text>

  <!-- Description — Arabic, right aligned -->
  <text x="1136" y="416"
        font-family="'Simplified Arabic', 'Geeza Pro', Arial, sans-serif"
        font-size="17" fill="#0E0E10" opacity="0.52" text-anchor="end" direction="rtl">انطلقت ماينورتي بارتنرز من المدينة المنورة في يناير ٢٠٢٦.</text>
  <text x="1136" y="442"
        font-family="'Simplified Arabic', 'Geeza Pro', Arial, sans-serif"
        font-size="17" fill="#0E0E10" opacity="0.52" text-anchor="end" direction="rtl">ستة أشهر من البناء الحقيقي — قبل توظيف أي ريال.</text>

  <!-- Footer rule (identical to EN) -->
  <line x1="64" y1="550" x2="1136" y2="550" stroke="#0E0E10" stroke-width="1" opacity="0.20"/>

  <!-- Author — right (RTL: name on the reading-start side) -->
  <text x="1136" y="588"
        font-family="'Simplified Arabic', 'Geeza Pro', Arial, sans-serif"
        font-size="11" fill="#0E0E10" opacity="0.38" text-anchor="end" direction="rtl">عبدالمجيد التركي  ·  شريك إداري</text>

  <!-- Year — left (opposite corner from author, same as EN's right-corner year) -->
  <text x="64" y="588"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#0E0E10" opacity="0.38" letter-spacing="2.5">2026</text>

</svg>
