<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Minority Partners — Six Months of Building Before Launching">

  <!-- Background: warm parchment, clearly distinct from site bone #ECE6DA -->
  <rect width="1200" height="630" fill="#CBC3B2"/>

  <!-- Grid — vertical -->
  <line x1="150"  y1="0" x2="150"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="300"  y1="0" x2="300"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="450"  y1="0" x2="450"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="600"  y1="0" x2="600"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="750"  y1="0" x2="750"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="900"  y1="0" x2="900"  y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="1050" y1="0" x2="1050" y2="630" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>

  <!-- Grid — horizontal -->
  <line x1="0" y1="90"  x2="1200" y2="90"  stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#0E0E10" stroke-width="1" opacity="0.07"/>

  <!-- Outer border -->
  <rect width="1200" height="630" fill="none" stroke="#0E0E10" stroke-width="1" opacity="0.16"/>

  <!-- Decorative circles — upper right -->
  <circle cx="1060" cy="195" r="112" stroke="#0E0E10" stroke-width="1" fill="none" opacity="0.08"/>
  <circle cx="1060" cy="195" r="56"  stroke="#0E0E10" stroke-width="1" fill="none" opacity="0.12"/>

  <!-- Header rule -->
  <line x1="64" y1="128" x2="1136" y2="128" stroke="#0E0E10" stroke-width="1" opacity="0.22"/>

  <!-- MP monogram -->
  <text x="64" y="72"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="22" font-weight="400" fill="#0E0E10" letter-spacing="4">MP</text>

  <!-- Brand · location -->
  <text x="64" y="100"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#0E0E10" opacity="0.45" letter-spacing="2.8">MINORITY PARTNERS  ·  MADINAH</text>

  <!-- Category · date · read time -->
  <text x="64" y="162"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" fill="#0E0E10" opacity="0.50" letter-spacing="2.2">COMMENTARY  ·  1 JULY 2026  ·  3 MIN READ</text>

  <!-- Title line 1 — ink -->
  <text x="64" y="276"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="60" font-weight="400" fill="#0E0E10" letter-spacing="-1.5">Six Months of Building</text>

  <!-- Title line 2 — cobalt italic -->
  <text x="64" y="350"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="60" font-style="italic" font-weight="400" fill="#151BB5" letter-spacing="-1.5">Before Launching</text>

  <!-- Description -->
  <text x="64" y="412"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="16" fill="#0E0E10" opacity="0.54">Minority Partners was founded in Madinah in January 2026.</text>
  <text x="64" y="436"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="16" fill="#0E0E10" opacity="0.54">Six months building thesis and architecture — before a single riyal.</text>

  <!-- Footer rule -->
  <line x1="64" y1="550" x2="1136" y2="550" stroke="#0E0E10" stroke-width="1" opacity="0.22"/>

  <!-- Author — left -->
  <text x="64" y="588"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#0E0E10" opacity="0.40" letter-spacing="2.5">ABDULMAJEED ALTURKI  ·  MANAGING PARTNER</text>

  <!-- Year — right -->
  <text x="1136" y="588"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#0E0E10" opacity="0.40" letter-spacing="2.5" text-anchor="end">2026</text>

</svg>
