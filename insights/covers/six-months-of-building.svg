<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Minority Partners — Six Months of Building Before Launching">

  <!-- Background: cobalt — distinct from site's bone -->
  <rect width="1200" height="630" fill="#151BB5"/>

  <!-- Vertical grid lines (12.5% intervals, mirrors hero pattern) -->
  <line x1="150"  y1="0" x2="150"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>
  <line x1="300"  y1="0" x2="300"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>
  <line x1="450"  y1="0" x2="450"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>
  <line x1="600"  y1="0" x2="600"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>
  <line x1="750"  y1="0" x2="750"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>
  <line x1="900"  y1="0" x2="900"  y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>
  <line x1="1050" y1="0" x2="1050" y2="630" stroke="#ECE6DA" stroke-width="1" opacity="0.06"/>

  <!-- Top / bottom rules -->
  <line x1="0" y1="0"   x2="1200" y2="0"   stroke="#ECE6DA" stroke-width="1" opacity="0.16"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#ECE6DA" stroke-width="1" opacity="0.16"/>

  <!-- Ring glyph — upper right, mirrors site platform glyph -->
  <circle cx="1060" cy="210" r="112" stroke="#ECE6DA" stroke-width="1" fill="none" opacity="0.07"/>
  <circle cx="1060" cy="210" r="54"  stroke="#ECE6DA" stroke-width="1" fill="none" opacity="0.12"/>

  <!-- MP monogram -->
  <text x="64" y="84"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="26" fill="#ECE6DA" letter-spacing="6">MP</text>

  <!-- Brand + location -->
  <text x="64" y="112"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#ECE6DA" opacity="0.45" letter-spacing="3">MINORITY PARTNERS  ·  MADINAH</text>

  <!-- Full-width rule -->
  <line x1="0" y1="140" x2="1200" y2="140" stroke="#ECE6DA" stroke-width="1" opacity="0.12"/>

  <!-- Category · date · read time -->
  <text x="64" y="178"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10" fill="#ECE6DA" opacity="0.6" letter-spacing="2.5">COMMENTARY  ·  1 JULY 2026  ·  3 MIN</text>

  <!-- Article title line 1 -->
  <text x="64" y="268"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="58" font-weight="400" fill="#ECE6DA" letter-spacing="-1.5">Six Months of Building</text>

  <!-- Article title line 2 — italic -->
  <text x="64" y="338"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="58" font-style="italic" font-weight="400" fill="#ECE6DA" letter-spacing="-1.5">Before Launching</text>

  <!-- Description -->
  <text x="64" y="400"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="16" fill="#ECE6DA" opacity="0.6">Minority Partners was founded in Madinah in January 2026.</text>
  <text x="64" y="422"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="16" fill="#ECE6DA" opacity="0.6">The first half — building the thesis before deploying a single riyal.</text>

  <!-- Footer rule -->
  <line x1="0" y1="548" x2="1200" y2="548" stroke="#ECE6DA" stroke-width="1" opacity="0.12"/>

  <!-- Author — left -->
  <text x="64" y="586"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#ECE6DA" opacity="0.45" letter-spacing="2.5">ABDULMAJEED ALTURKI  ·  MANAGING PARTNER</text>

  <!-- Year — right -->
  <text x="1136" y="586"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" fill="#ECE6DA" opacity="0.45" letter-spacing="2.5" text-anchor="end">2026</text>

</svg>
